<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient - deep premium purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B2FE8"/>
      <stop offset="50%" style="stop-color:#6B18B5"/>
      <stop offset="100%" style="stop-color:#4A0E8F"/>
    </linearGradient>
    <!-- Shine gradient for the diagonal glint -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="40%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="60%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- W letter gradient -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0D0F0"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3A0970" flood-opacity="0.5"/>
    </filter>
    <!-- Glow filter for sparkles -->
    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle text shadow -->
    <filter id="textGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="115" fill="url(#innerGlow)"/>

  <!-- Geometric accent lines - representing ceramic coating layers -->
  <line x1="60" y1="420" x2="180" y2="420" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <line x1="60" y1="435" x2="140" y2="435" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="332" y1="92" x2="452" y2="92" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <line x1="372" y1="77" x2="452" y2="77" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Stylized "W" - elegant geometric construction -->
  <g filter="url(#textGlow)">
    <path d="
      M 108 148
      L 160 148
      L 205 320
      L 256 195
      L 307 320
      L 352 148
      L 404 148
      L 326 388
      L 274 388
      L 256 340
      L 238 388
      L 186 388
      Z
    " fill="url(#wGrad)" opacity="0.95"/>
  </g>

  <!-- Vitrification shine streak - diagonal -->
  <rect x="-50" y="220" width="620" height="45" rx="22" fill="url(#shine)" transform="rotate(-35, 256, 256)"/>

  <!-- Sparkle effects - representing the ceramic shine -->
  <!-- Top-right sparkle -->
  <g filter="url(#sparkleGlow)" opacity="0.9">
    <line x1="390" y1="100" x2="390" y2="140" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="370" y1="120" x2="410" y2="120" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="376" y1="106" x2="404" y2="134" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="404" y1="106" x2="376" y2="134" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small sparkle - bottom left area -->
  <g filter="url(#sparkleGlow)" opacity="0.6">
    <line x1="125" y1="395" x2="125" y2="415" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="115" y1="405" x2="135" y2="405" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Tiny sparkle - mid left -->
  <g filter="url(#sparkleGlow)" opacity="0.4">
    <circle cx="85" cy="250" r="2" fill="white"/>
  </g>

  <!-- Tiny sparkle accent -->
  <g filter="url(#sparkleGlow)" opacity="0.5">
    <circle cx="430" cy="300" r="2.5" fill="white"/>
  </g>

  <!-- Premium border ring -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
</svg>
